<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adyen Charity POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#080d19] text-white min-h-screen flex flex-col items-center justify-center p-6 select-none font-sans">

  <div class="max-w-sm w-full bg-[#0c1424] border border-slate-800/90 rounded-3xl p-8 shadow-2xl flex flex-col items-center">

    <!-- Header Logos -->
    <div class="bg-white px-4 py-3 rounded-2xl flex items-center space-x-3 shadow-lg mb-10 w-full justify-center">
      <img src="/images/Adyen%20Logo.jpeg" alt="Adyen" class="h-5 object-contain" />
      <span class="text-slate-300 font-light text-sm">✕</span>
      <img src="/images/SAP%20LOGO.jpeg" alt="SAP" class="h-7 object-contain" />
      <span class="text-slate-300 font-light text-sm">✕</span>
      <img src="/images/parloa_logo.jpeg" alt="Parloa" class="h-5 object-contain" />
    </div>

    <h1 class="text-xl font-bold text-slate-300 uppercase tracking-widest mb-6 text-center">Select Your Booth</h1>

    <!-- Terminal Dropdown -->
    <div class="relative w-full mb-10">
      <select id="terminal-select" class="w-full bg-slate-900 border-2 border-slate-700 text-emerald-400 font-bold rounded-2xl p-5 appearance-none focus:outline-none focus:border-emerald-500 text-xl text-center shadow-inner transition-colors cursor-pointer">
        <option value="" disabled selected>Loading booths...</option>
      </select>
      <!-- Dropdown Icon -->
      <div class="absolute inset-y-0 right-5 flex items-center pointer-events-none">
        <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </div>
    </div>

    <!-- Giant Start Button -->
    <button id="start-btn" class="w-full bg-gradient-to-r from-[#0abf53] to-[#08a346] hover:brightness-110 active:scale-95 transition-all text-white font-black text-4xl py-8 rounded-2xl shadow-[0_0_50px_rgba(10,191,83,0.3)] border border-emerald-400/50 flex flex-col items-center gap-2">
      <span>START</span>
      <span class="text-sm font-medium tracking-widest uppercase opacity-80">Tap to Donate</span>
    </button>
  </div>

  <script>
    // Hardcoded terminals based on your dashboard logic (Replace or integrate with your fetch API if they are dynamic)
    const availableTerminals = [
      "P400Plus-807243868", 
      "P400Plus-454155335", 
      "P400Plus-452806254"
    ];

    const select = document.getElementById('terminal-select');

    function populateDropdown(terminals) {
      select.innerHTML = ''; // Clear loading state

      terminals.forEach((terminalId, index) => {
        // Extract the last 5 digits of the terminal ID
        const last5 = terminalId.slice(-5);
        const boothNum = index + 1; 

        const option = document.createElement('option');
        option.value = terminalId;
        // Format to: Booth X-12345
        option.textContent = `Booth ${boothNum}-${last5}`;

        select.appendChild(option);
      });
    }

    // Initialize dropdown
    populateDropdown(availableTerminals);

    // Start Button Logic
    document.getElementById('start-btn').addEventListener('click', () => {
      const selectedTerminal = select.value;
      if (!selectedTerminal) return alert('Please select a booth first!');

      // Example of triggering the payment on the backend
      fetch('/api/start-transaction', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ terminalId: selectedTerminal, amount: 10 })
      })
      .then(res => res.json())
      .then(data => {
        console.log('Transaction initiated on:', selectedTerminal);
        // Provide haptic feedback if on mobile
        if (navigator.vibrate) navigator.vibrate(50);
      })
      .catch(err => console.error('Error starting transaction:', err));
    });
  </script>
</body>
</html>

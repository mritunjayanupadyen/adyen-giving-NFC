<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Adyen Charity POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pulse-ring {
      box-shadow: 0 0 0 0 rgba(10, 191, 83, 0.7);
      animation: pulse 1.6s infinite cubic-bezier(0.66, 0, 1);
    }
    @keyframes pulse {
      to { box-shadow: 0 0 0 28px rgba(10, 191, 83, 0); }
    }
  </style>
</head>
<body class="bg-[#080d19] text-white min-h-screen flex flex-col items-center justify-center p-6 select-none font-sans">

  <div class="max-w-sm w-full bg-[#0c1424] border border-slate-800/90 rounded-3xl p-8 shadow-2xl flex flex-col items-center">

    <!-- Header Logos -->
    <div class="bg-white px-4 py-3 rounded-2xl flex items-center space-x-3 shadow-lg mb-10 w-full justify-center">
      <img src="/images/Adyen%20Logo.jpeg" alt="Adyen" class="h-5 object-contain" onerror="this.src='/images/adyen.png'" />
      <span class="text-slate-300 font-light text-sm">✕</span>
      <img src="/images/SAP%20LOGO.jpeg" alt="SAP" class="h-7 object-contain" onerror="this.src='/images/sap.png'" />
      <span class="text-slate-300 font-light text-sm">✕</span>
      <img src="/images/parloa_logo.jpeg" alt="Parloa" class="h-5 object-contain" 
           onerror="this.onerror=null; this.src='/images/image%20(6).png';" />
    </div>

    <h1 class="text-xl font-bold text-slate-300 uppercase tracking-widest mb-6 text-center">Select Your Booth</h1>

    <!-- Formatted Terminal Dropdown -->
    <div class="relative w-full mb-8">
      <select id="terminal-select" onchange="onTerminalChanged()" class="w-full bg-slate-900 border-2 border-slate-700 text-emerald-400 font-bold rounded-2xl p-5 appearance-none focus:outline-none focus:border-emerald-500 text-xl text-center shadow-inner transition-colors cursor-pointer">
        <option value="" disabled selected>Loading booths...</option>
      </select>
      <div class="absolute inset-y-0 right-5 flex items-center pointer-events-none">
        <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </div>
    </div>

    <!-- Giant Start Button -->
    <button id="start-btn" onclick="startTapSession()" class="w-full bg-gradient-to-r from-[#0abf53] to-[#08a346] hover:brightness-110 active:scale-95 transition-all text-white font-black text-4xl py-8 rounded-2xl shadow-[0_0_50px_rgba(10,191,83,0.3)] border border-emerald-400/50 flex flex-col items-center gap-2 pulse-ring">
      <span id="btn-text">START</span>
      <span id="btn-subtext" class="text-sm font-medium tracking-widest uppercase opacity-80">Tap to Donate</span>
    </button>

    <!-- Status Messages -->
    <div id="status-card" class="mt-6 text-center min-h-[50px] flex flex-col items-center justify-center w-full">
      <p id="status-title" class="text-sm font-semibold text-slate-400">Ready for next tap</p>
      <p id="status-desc" class="text-xs text-slate-500 mt-1">POIID: <span id="active-poiid" class="font-mono text-emerald-500">---</span></p>
    </div>

  </div>

  <script>
    const socket = io();
    const terminalSelect = document.getElementById('terminal-select');
    const activePoiidSpan = document.getElementById('active-poiid');
    const startBtn = document.getElementById('start-btn');
    const btnText = document.getElementById('btn-text');
    const btnSubtext = document.getElementById('btn-subtext');
    const statusTitle = document.getElementById('status-title');

    let terminalsMap = {};
    let isBusy = false;

    // Fetch dynamic terminals and format with partner booth names
    async function loadTerminals() {
      try {
        const res = await fetch('/api/terminals');
        const data = await res.json();

        if (data.success && data.terminals.length > 0) {
          terminalSelect.innerHTML = '';

          data.terminals.forEach((term) => {
            terminalsMap[term.id] = term;

            // Extracts "Booth Adyen", "Booth Parloa", etc. from server.js
            const cleanBooth = term.name.split(' - ')[0].trim();
            const last5 = term.poiid.slice(-5);

            const opt = document.createElement('option');
            opt.value = term.id;
            opt.textContent = `${cleanBooth} (${last5})`;
            terminalSelect.appendChild(opt);
          });

          const urlParams = new URLSearchParams(window.location.search);
          const savedTerminal = urlParams.get('terminal') || localStorage.getItem('selected_terminal') || data.terminals[0].id;

          if (terminalsMap[savedTerminal]) {
            terminalSelect.value = savedTerminal;
          }
          updateTerminalUI();
        }
      } catch (err) {
        console.error('Failed to load terminals:', err);
      }
    }

    function onTerminalChanged() {
      const selectedId = terminalSelect.value;
      localStorage.setItem('selected_terminal', selectedId);
      updateTerminalUI();
    }

    function updateTerminalUI() {
      const current = terminalsMap[terminalSelect.value];
      if (current) {
        activePoiidSpan.textContent = current.poiid;
      }
    }

    async function startTapSession() {
      if (isBusy) return;
      const selectedId = terminalSelect.value;
      const currentTerminal = terminalsMap[selectedId];

      if (!currentTerminal) {
        alert('Please choose a booth from the dropdown.');
        return;
      }

      isBusy = true;
      terminalSelect.disabled = true;

      // Waiting State
      startBtn.classList.remove('pulse-ring', 'bg-gradient-to-r', 'from-[#0abf53]', 'to-[#08a346]', 'border-emerald-400/50');
      startBtn.classList.add('bg-amber-500', 'border-amber-400', 'animate-pulse');
      btnText.textContent = 'TAP CARD';
      btnSubtext.textContent = 'Waiting for terminal...';

      const cleanBooth = currentTerminal.name.split(' - ')[0].trim();
      statusTitle.textContent = `Present card on ${cleanBooth}`;
      statusTitle.className = 'text-sm font-bold text-amber-500';

      if (navigator.vibrate) navigator.vibrate(50);

      try {
        const response = await fetch('/api/start-tap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ terminalId: selectedId })
        });
        const result = await response.json();

        if (result.success) {
          // Success State showing $20 USD contributed
          startBtn.classList.remove('bg-amber-500', 'border-amber-400', 'animate-pulse');
          startBtn.classList.add('bg-emerald-500', 'border-emerald-400');
          btnText.textContent = 'SUCCESS!';
          btnSubtext.textContent = `+$${result.addedUSD || 20} USD Contributed`;
          statusTitle.textContent = 'Transaction Complete!';
          statusTitle.className = 'text-sm font-bold text-emerald-500';

          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        } else {
          throw new Error(result.error || 'Tap failed');
        }
      } catch (err) {
        // Error State
        startBtn.classList.remove('bg-amber-500', 'border-amber-400', 'animate-pulse');
        startBtn.classList.add('bg-rose-600', 'border-rose-400');
        btnText.textContent = 'RETRY';
        btnSubtext.textContent = 'Session Timed Out';
        statusTitle.textContent = 'Transaction Cancelled or Failed';
        statusTitle.className = 'text-sm font-bold text-rose-500';
      } finally {
        setTimeout(resetButton, 3500);
      }
    }

    function resetButton() {
      startBtn.className = 'w-full bg-gradient-to-r from-[#0abf53] to-[#08a346] hover:brightness-110 active:scale-95 transition-all text-white font-black text-4xl py-8 rounded-2xl shadow-[0_0_50px_rgba(10,191,83,0.3)] border border-emerald-400/50 flex flex-col items-center gap-2 pulse-ring';
      btnText.textContent = 'START';
      btnSubtext.textContent = 'Tap to Donate';
      statusTitle.textContent = 'Ready for next tap';
      statusTitle.className = 'text-sm font-semibold text-slate-400';
      terminalSelect.disabled = false;
      isBusy = false;
    }

    socket.on('initial_state', (state) => {
      if (state.terminals) {
        terminalsMap = state.terminals;
        updateTerminalUI();
      }
    });

    socket.on('tap_success', (data) => {
      if (data.state && data.state.terminals) {
        terminalsMap = data.state.terminals;
        updateTerminalUI();
      }
    });

    loadTerminals();
  </script>
</body>
</html>
